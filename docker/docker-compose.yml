version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: rentacar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rentacar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rentacar_secret}
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rentacar -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.7.0
    container_name: rentacar-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: rentacar-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI & REST API
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: ""
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 1025 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  identity-agency-service:
    image: eclipse-temurin:21-jre-alpine
    container_name: rentacar-identity
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/identity_db
      SPRING_DATASOURCE_USERNAME: rentacar
      SPRING_DATASOURCE_PASSWORD: rentacar_secret
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    volumes:
      - ../backend/services/identity-agency-service/build/libs/identity-agency-service-1.0.0.jar:/app/app.jar:ro
    command: ["java", "-jar", "/app/app.jar"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  fleet-service:
    image: eclipse-temurin:21-jre-alpine
    container_name: rentacar-fleet
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fleet_db
      SPRING_DATASOURCE_USERNAME: rentacar
      SPRING_DATASOURCE_PASSWORD: rentacar_secret
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    volumes:
      - ../backend/services/fleet-service/build/libs/fleet-service-1.0.0.jar:/app/app.jar:ro
    command: ["java", "-jar", "/app/app.jar"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  pool-service:
    image: eclipse-temurin:21-jre-alpine
    container_name: rentacar-pool
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pool_db
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: rentacar
      DB_PASSWORD: rentacar_secret
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    volumes:
      - ../backend/services/pool-service/build/libs/pool-service-1.0.0.jar:/app/app.jar:ro
    command: ["java", "-jar", "/app/app.jar"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  notification-service:
    image: eclipse-temurin:21-jre-alpine
    container_name: rentacar-notification
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: "1025"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    volumes:
      - ../backend/services/notification-service/build/libs/notification-service-1.0.0.jar:/app/app.jar:ro
    command: ["java", "-jar", "/app/app.jar"]
    depends_on:
      mailpit:
        condition: service_healthy
      kafka:
        condition: service_healthy

  api-gateway:
    image: eclipse-temurin:21-jre-alpine
    container_name: rentacar-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      IDENTITY_SERVICE_URL: http://identity-agency-service:8081
      FLEET_SERVICE_URL: http://fleet-service:8082
      POOL_SERVICE_URL: http://pool-service:8083
    volumes:
      - ../backend/services/api-gateway/build/libs/api-gateway-1.0.0.jar:/app/app.jar:ro
    command: ["java", "-jar", "/app/app.jar"]
    depends_on:
      - identity-agency-service
      - fleet-service
      - pool-service

volumes:
  postgres_data:
